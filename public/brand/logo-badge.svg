<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Rohokale Farm — Maharashtra, India">
  <defs>
    <clipPath id="scene"><path d="M100 18a82 82 0 0 1 82 82v6H18v-6a82 82 0 0 1 82-82Z"/></clipPath>
    <path id="arc" d="M22 100a78 78 0 0 0 156 0"/>
  </defs>
  <circle cx="100" cy="100" r="92" fill="#F7F2E8" stroke="#14301F" stroke-width="2.4"/>
  <circle cx="100" cy="100" r="85" fill="none" stroke="#14301F" stroke-width=".9"/>
  <g clip-path="url(#scene)">
    <!-- sky lines -->
    <g stroke="#14301F" stroke-width=".8" opacity=".35"><path d="M40 44h36M126 38h44M30 58h28M148 56h30"/></g>
    <!-- rising keshar sun -->
    <circle cx="100" cy="80" r="22" fill="#E9A23B"/>
    <!-- hills -->
    <path d="M14 84c20-10 40-14 58-8 12 4 20 6 30 2 16-7 34-10 56-4 12 3 20 6 30 10v30H14Z" fill="#2F7D3A"/>
    <path d="M14 90c26-6 52-7 86-2s60 4 86-2v30H14Z" fill="#14301F"/>
    <!-- furrowed onion rows converging to horizon -->
    <g stroke="#F7F2E8" stroke-width="1.3" opacity=".75">
      <path d="M100 90 30 110M100 90 55 110M100 90 80 110M100 90 100 110M100 90 120 110M100 90 145 110M100 90 170 110"/>
    </g>
    <!-- tiny farmer silhouettes / crop tufts -->
    <g fill="#14301F"><path d="M40 82l2-6 2 6zM48 80l2-7 2 7zM152 80l2-6 2 6zM160 82l2-7 2 7z"/></g>
  </g>
  <!-- banner -->
  <path d="M8 106h184M8 132h184" stroke="#14301F" stroke-width="1.6"/>
  <rect x="8" y="108" width="184" height="22" fill="#F7F2E8"/>
  <path d="M14 119c-6 0-8-6-3-7 4-1 5 3 2 4M186 119c6 0 8-6 3-7-4-1-5 3-2 4" fill="none" stroke="#14301F" stroke-width="1.3" stroke-linecap="round"/>
  <text x="100" y="126" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="15" font-weight="700" letter-spacing="1.6" fill="#14301F">ROHOKALE FARM</text>
  <!-- location + tagline -->
  <text x="100" y="145" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="6.4" font-weight="800" letter-spacing="1.8" fill="#14301F" opacity=".75">MAHARASHTRA · INDIA</text>
  <path d="M90 151h20" stroke="#E9A23B" stroke-width="1.2"/>
  <text font-family="Manrope, Arial, sans-serif" font-size="8" font-weight="800" letter-spacing="1" fill="#2F7D3A" text-anchor="middle">
    <textPath href="#arc" startOffset="50%" textLength="112" lengthAdjust="spacingAndGlyphs">GENERATIONS OF QUALITY</textPath>
  </text>
</svg>
